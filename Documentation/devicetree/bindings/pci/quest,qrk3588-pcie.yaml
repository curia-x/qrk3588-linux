%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/quest,qrk3588-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Quest QRK3588 DesignWare PCIe host controller

maintainers:
  - ninozhang001@gmail.com

description: |
  The QRK3588 PCIe1L0 and PCIe1L2 root ports use a Synopsys DesignWare PCIe
  controller connected to a single-lane Combo PIPE PHY.  The glue driver owns
  the PHP power-domain wakeup, controller resets, endpoint PERST# signal,
  and link startup. The PHY provider owns PHY clocks, resets and routing.

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#

properties:
  compatible:
    const: quest,qrk3588-pcie

  reg:
    items:
      - description: DesignWare DBI and unrolled iATU registers
      - description: Outbound PCI configuration-space aperture
      - description: PCIe client/APB registers

  reg-names:
    items:
      - const: dbi
      - const: config
      - const: apb

  phys:
    maxItems: 1

  phy-names:
    const: pcie

  quest,pmu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the shared PMU syscon.

  clocks:
    minItems: 15
    maxItems: 15

  clock-names:
    items:
      - const: core
      - const: pcie-biu
      - const: php-biu
      - const: pcie-bridge
      - const: php-root
      - const: pcie-root
      - const: php-biu-pclk
      - const: php-root-pclk
      - const: mmu-biu
      - const: mmu-pcie
      - const: dbi
      - const: slave
      - const: master
      - const: aux
      - const: pipe

  resets:
    minItems: 2
    maxItems: 2

  reset-names:
    items:
      - const: pipe
      - const: power-up

  reset-gpios:
    description: GPIO driving the downstream endpoint PERST# input.
    maxItems: 1

  num-lanes:
    const: 1

  max-link-speed:
    maximum: 2

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - reset-gpios
  - num-lanes
  - msi-map
  - phys
  - phy-names
  - quest,pmu

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    pcie@f5800000 {
        compatible = "quest,qrk3588-pcie";
        device_type = "pci";
        reg = <0xf5800000 0x00400000>, <0xf2000000 0x00100000>,
              <0xfe170000 0x00010000>;
        reg-names = "dbi", "config", "apb";
        phys = <&combphy1>;
        phy-names = "pcie";
        quest,pmu = <&pmu>;
        clocks = <&cru 12>, <&cru 16>, <&cru 17>, <&cru 18>, <&cru 19>,
                 <&cru 20>, <&cru 21>, <&cru 22>, <&cru 23>, <&cru 24>,
                 <&cru 25>, <&cru 26>, <&cru 27>, <&cru 28>, <&cru 29>;
        clock-names = "core", "pcie-biu", "php-biu", "pcie-bridge",
                      "php-root", "pcie-root", "php-biu-pclk", "php-root-pclk",
                      "mmu-biu", "mmu-pcie", "dbi", "slave", "master", "aux",
                      "pipe";
        resets = <&cru 2>, <&cru 3>;
        reset-names = "pipe", "power-up";
        reset-gpios = <&gpio4 11 GPIO_ACTIVE_LOW>;
        msi-map = <0x0 &its0 0x0 0x10000>;
        bus-range = <0x0 0xff>;
        #address-cells = <3>;
        #size-cells = <2>;
        #interrupt-cells = <1>;
        interrupt-map-mask = <0 0 0 7>;
        interrupt-map = <0 0 0 1 &gic 0 240 4>;
        num-lanes = <1>;
        max-link-speed = <2>;
        ranges = <0x82000000 0 0x01000000 0xf2200000 0 0x01e00000>;
    };
...
