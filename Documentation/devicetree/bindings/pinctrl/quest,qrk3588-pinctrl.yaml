%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/quest,qrk3588-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Quest QRK3588 Pin Controller

maintainers:
  - ninozhang001@gmail.com

description:
  The QRK3588 pin controller selects peripheral and GPIO functions through
  the PMU1, PMU2, BUS and eMMC IO-controller register blocks.

properties:
  compatible:
    const: quest,qrk3588-pinctrl

  reg:
    minItems: 4
    maxItems: 4

  reg-names:
    items:
      - const: pmu1-ioc
      - const: pmu2-ioc
      - const: bus-ioc
      - const: emmc-ioc

patternProperties:
  '-pins$':
    type: object
    allOf:
      - $ref: pincfg-node.yaml#
      - $ref: pinmux-node.yaml#
    additionalProperties: false
    properties:
      groups:
        enum:
          - uart2m0
          - emmc-cmd
          - emmc-clk-strobe
          - emmc-rstn
          - emmc-data

      function:
        enum: [ uart2, emmc ]

      bias-disable: true
      bias-pull-down: true
      bias-pull-up: true
      input-enable: true
      input-schmitt-disable: true
      output-impedance-ohms:
        const: 40

    required:
      - groups
      - function

allOf:
  - $ref: pinctrl.yaml#

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    pinctrl@fd5f0000 {
        compatible = "quest,qrk3588-pinctrl";
        reg = <0xfd5f0000 0x4000>,
              <0xfd5f4000 0x4000>,
              <0xfd5f8000 0x1000>,
              <0xfd5fd000 0x1000>;
        reg-names = "pmu1-ioc", "pmu2-ioc", "bus-ioc", "emmc-ioc";

        uart2m0-pins {
            groups = "uart2m0";
            function = "uart2";
        };
    };
