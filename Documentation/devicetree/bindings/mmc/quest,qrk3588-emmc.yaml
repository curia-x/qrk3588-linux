%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/quest,qrk3588-emmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Quest QRK3588 eMMC host controller

maintainers:
  - ninozhang001@gmail.com

description: |
  The QRK3588 eMMC integration uses the SDHCI register interface, five CRU
  clocks and a SYS_GRF card-clock gate. The initial implementation supports
  SDR transfers up to 24 MHz with fixed board supplies.

allOf:
  - $ref: sdhci-common.yaml#

properties:
  compatible:
    const: quest,qrk3588-emmc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 5

  clock-names:
    items:
      - const: card
      - const: ahb
      - const: axi
      - const: base
      - const: timer

  quest,sys-grf:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SYS_GRF containing the eMMC clock gate and stability controls.

  bus-width:
    const: 8

  max-frequency:
    minimum: 375000
    maximum: 24000000

  non-removable: true
  no-sd: true
  no-sdio: true
  vmmc-supply: true
  vqmmc-supply: true

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - quest,sys-grf
  - bus-width
  - max-frequency
  - non-removable
  - no-sd
  - no-sdio
  - vmmc-supply
  - vqmmc-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/quest,qrk3588-cru.h>

    mmc@fe2e0000 {
        compatible = "quest,qrk3588-emmc";
        reg = <0xfe2e0000 0x10000>;
        interrupts = <GIC_SPI 205 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&cru QRK3588_CLK_CCLK_EMMC>,
                 <&cru QRK3588_CLK_HCLK_EMMC>,
                 <&cru QRK3588_CLK_ACLK_EMMC>,
                 <&cru QRK3588_CLK_BCLK_EMMC>,
                 <&cru QRK3588_CLK_TMCLK_EMMC>;
        clock-names = "card", "ahb", "axi", "base", "timer";
        quest,sys-grf = <&sys_grf>;
        bus-width = <8>;
        max-frequency = <24000000>;
        non-removable;
        no-sd;
        no-sdio;
        vmmc-supply = <&vcc_emmc>;
        vqmmc-supply = <&vccq_emmc>;
    };
...
