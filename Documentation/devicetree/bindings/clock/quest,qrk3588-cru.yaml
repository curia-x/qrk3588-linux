%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/quest,qrk3588-cru.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Quest QRK3588 clock controller

maintainers:
  - ninozhang001@gmail.com

description: |
  The QRK3588 clock and reset unit supplies clocks for the eMMC, GPIO, PCIe
  and UART blocks. The provider spans the main CRU, PHP-top CRU and PMU1 CRU
  register regions.

properties:
  compatible:
    const: quest,qrk3588-cru

  reg:
    minItems: 3
    maxItems: 3

  reg-names:
    items:
      - const: cru
      - const: phptop-cru
      - const: pmu1-cru

  '#clock-cells':
    const: 1
    description: Clock index defined in quest,qrk3588-cru.h.

  '#reset-cells':
    const: 1
    description: Reset index defined in quest,qrk3588-cru.h.

required:
  - compatible
  - reg
  - reg-names
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    clock-controller@fd7c0000 {
        compatible = "quest,qrk3588-cru";
        reg = <0xfd7c0000 0x8000>,
              <0xfd7c8000 0x8000>,
              <0xfd7f0000 0x10000>;
        reg-names = "cru", "phptop-cru", "pmu1-cru";
        #clock-cells = <1>;
        #reset-cells = <1>;
    };
...
